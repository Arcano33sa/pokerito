<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Soporte">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b59b6" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9b59b6" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- headset -->
  <g transform="translate(90 36)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 170c0-86 58-138 150-138s150 52 150 138" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="18"/>
    <path d="M170 170c0-68 44-110 120-110s120 42 120 110" fill="none" stroke="#9b59b6" stroke-opacity="0.18" stroke-width="14"/>

    <rect x="86" y="162" width="78" height="132" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.66" stroke-width="10"/>
    <rect x="416" y="162" width="78" height="132" rx="28" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.66" stroke-width="10"/>

    <path d="M86 250c0 34 20 56 52 56h40" fill="none" stroke="#9b59b6" stroke-opacity="0.20" stroke-width="14"/>
  </g>

  <!-- folder + import/export arrows -->
  <g transform="translate(320 150)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 36h92l28 28h140c18 0 32 14 32 32v124c0 18-14 32-32 32H40c-18 0-32-14-32-32V68c0-18 14-32 32-32Z" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.70" stroke-width="10"/>

    <g transform="translate(70 104)" fill="none" stroke="#9b59b6" stroke-opacity="0.32" stroke-width="12">
      <path d="M0 54h112"/>
      <path d="M86 28l26 26-26 26"/>
    </g>
    <g transform="translate(194 188)" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="12">
      <path d="M112 0H0"/>
      <path d="M26-26L0 0l26 26"/>
    </g>

    <!-- small badge -->
    <g transform="translate(268 22)">
      <circle cx="0" cy="0" r="30" fill="url(#accent)" stroke="#ffffff" stroke-opacity="0.40" stroke-width="10"/>
      <path d="M-10 0h20" stroke="#ffffff" stroke-opacity="0.50" stroke-width="10"/>
      <path d="M0-10v20" stroke="#ffffff" stroke-opacity="0.26" stroke-width="10"/>
    </g>
