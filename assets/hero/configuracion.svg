<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Configuración">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3498db" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3498db" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- backdrop rings -->
  <circle cx="492" cy="118" r="96" fill="none" stroke="#3498db" stroke-opacity="0.12" stroke-width="18"/>
  <circle cx="492" cy="118" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="14"/>

  <!-- clipboard -->
  <g transform="translate(130 40)" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="18" width="330" height="300" rx="28" fill="url(#sheet)" stroke="#ffffff" stroke-opacity="0.72" stroke-width="10"/>
    <rect x="106" y="0" width="118" height="70" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#3498db" stroke-opacity="0.32" stroke-width="10"/>
    <path d="M150 38h30" stroke="#ffffff" stroke-opacity="0.40" stroke-width="10"/>

    <!-- chart bars -->
    <g transform="translate(44 118)">
      <path d="M0 168h240" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10"/>
      <rect x="18" y="92" width="44" height="76" rx="12" fill="url(#accent)" stroke="#ffffff" stroke-opacity="0.26" stroke-width="8"/>
      <rect x="84" y="58" width="44" height="110" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#3498db" stroke-opacity="0.30" stroke-width="8"/>
      <rect x="150" y="28" width="44" height="140" rx="12" fill="url(#accent)" stroke="#ffffff" stroke-opacity="0.26" stroke-width="8"/>

      <!-- line graph -->
      <path d="M18 110l66-34 66 26 66-62" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="10"/>
      <g fill="#3498db" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.45" stroke-width="8">
        <circle cx="18" cy="110" r="10"/>
        <circle cx="84" cy="76" r="10"/>
        <circle cx="150" cy="102" r="10"/>
        <circle cx="216" cy="40" r="10"/>
      </g>
    </g>

    <!-- checklist -->
    <g transform="translate(46 88)" stroke="#ffffff" stroke-opacity="0.30" stroke-width="10">
      <path d="M0 0h120"/>
      <path d="M0 44h150"/>
      <path d="M0 214h110"/>
    </g>
  </g>

  <!-- chip + mini gear hint -->
  <g transform="translate(470 250)" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="0" cy="0" r="52" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.60" stroke-width="10"/>
    <circle cx="0" cy="0" r="30" fill="#000" fill-opacity="0" stroke="#3498db" stroke-opacity="0.22" stroke-width="10"/>
    <path d="M0-52v20M0 32v20M-52 0h20M32 0h20" stroke="#ffffff" stroke-opacity="0.26" stroke-width="10"/>

    <g transform="translate(98 -40)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="10">
      <circle cx="0" cy="0" r="26" fill="#3498db" fill-opacity="0.08"/>
      <path d="M0-18v36M-18 0h36" stroke-opacity="0.22"/>
      <path d="M-10-10l20 20M10-10l-20 20" stroke-opacity="0.18"/>
    </g>
  </g>
</svg>
