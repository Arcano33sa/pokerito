<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Usuarios">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- glow rings -->
  <circle cx="470" cy="110" r="92" fill="none" stroke="#d4af37" stroke-opacity="0.14" stroke-width="18"/>
  <circle cx="470" cy="110" r="56" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="14"/>

  <!-- group silhouettes -->
  <g fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="210" cy="142" r="42"/>
    <path d="M130 268c0-44 36-80 80-80s80 36 80 80"/>

    <circle cx="430" cy="150" r="34"/>
    <path d="M366 268c0-36 29-66 64-66s64 30 64 66"/>

    <circle cx="332" cy="116" r="52"/>
    <path d="M232 268c0-56 45-102 100-102s100 46 100 102"/>
  </g>

  <!-- central badge -->
  <g transform="translate(210 58)" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="40" width="220" height="250" rx="28" fill="url(#sheet)" stroke="#ffffff" stroke-opacity="0.74" stroke-width="10"/>

    <!-- crown (role admin) -->
    <path d="M60 120l22 22 28-40 28 40 22-22 10 66H50l10-66z" fill="url(#accent)" stroke="#d4af37" stroke-opacity="0.34" stroke-width="10"/>
    <path d="M62 186h96" stroke="#ffffff" stroke-opacity="0.20" stroke-width="10"/>

    <!-- lock -->
    <g transform="translate(70 198)">
      <rect x="0" y="36" width="80" height="72" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.34" stroke-width="10"/>
      <path d="M18 36v-14c0-18 14-32 22-32s22 14 22 32v14" fill="none" stroke="#d4af37" stroke-opacity="0.38" stroke-width="10"/>
      <path d="M40 70v18" stroke="#ffffff" stroke-opacity="0.34" stroke-width="10"/>
    </g>
  </g>

  <!-- subtle particles -->
  <g fill="#d4af37" fill-opacity="0.20">
    <circle cx="96" cy="78" r="4"/>
    <circle cx="548" cy="272" r="3"/>
    <circle cx="560" cy="64" r="3"/>
    <circle cx="84" cy="290" r="3"/>
  </g>
</svg>
