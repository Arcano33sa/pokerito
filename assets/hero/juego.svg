      <path d="M0 250c-4 0-8-2-11-5-30-28-82-62-82-108 0-26 20-46 46-46 18 0 34 10 47 26 13-16 29-26 47-26 26 0 46 20 46 46 0 46-52 80-82 108-3 3-7 5-11 5Z" fill="#ffffff" fill-opacity="0.07" stroke="#2ecc71" stroke-opacity="0.45"/>
    </g>
  </g>

  <!-- chips -->
  <g transform="translate(0 0)" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(160 274)">
      <circle cx="0" cy="0" r="46" fill="url(#chipFill)" stroke="#ffffff" stroke-opacity="0.70" stroke-width="10"/>
      <circle cx="0" cy="0" r="26" fill="#000" fill-opacity="0" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
      <path d="M0-46v18M0 28v18M-46 0h18M28 0h18" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10"/>
    </g>
    <g transform="translate(290 292)">
