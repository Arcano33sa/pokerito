    <g transform="translate(250 78) rotate(-10)">
      <rect x="-120" y="0" width="220" height="290" rx="26" fill="url(#cardFill)"/>
      <path d="M-70 64h110" stroke-opacity="0.35"/>
      <path d="M-70 98h110" stroke-opacity="0.25"/>
      <path d="M-70 132h88" stroke-opacity="0.22"/>
      <!-- spade -->
      <path d="M-2 198c22-18 48-36 48-62 0-20-16-36-36-36-14 0-25 7-32 18-7-11-18-18-32-18-20 0-36 16-36 36 0 26 26 44 48 62 10 8 20 16 20 28 0 16-10 26-28 26h56c-18 0-28-10-28-26 0-12 10-20 20-28Z" fill="#000" fill-opacity="0"/>
      <path d="M-2 198c22-18 48-36 48-62 0-20-16-36-36-36-14 0-25 7-32 18-7-11-18-18-32-18-20 0-36 16-36 36 0 26 26 44 48 62 10 8 20 16 20 28 0 16-10 26-28 26h56c-18 0-28-10-28-26 0-12 10-20 20-28Z" stroke="#ffffff" stroke-opacity="0.55" fill="#ffffff" fill-opacity="0.06"/>
      <path d="M-2 258l-18 30h36l-18-30Z" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.35"/>
    </g>

    <g transform="translate(380 58) rotate(8)">
      <rect x="-110" y="0" width="220" height="290" rx="26" fill="url(#cardFill)"/>
      <path d="M-60 64h110" stroke-opacity="0.35"/>
      <path d="M-60 98h110" stroke-opacity="0.25"/>
      <path d="M-60 132h88" stroke-opacity="0.22"/>
