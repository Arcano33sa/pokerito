  </defs>

  <!-- subtle table arc -->
  <path d="M70 254c52-74 142-118 250-118s198 44 250 118" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="18" stroke-linecap="round"/>
  <path d="M96 262c46-60 124-94 224-94s178 34 224 94" fill="none" stroke="#2ecc71" stroke-opacity="0.10" stroke-width="14" stroke-linecap="round"/>

  <!-- cards -->
