      <circle cx="0" cy="0" r="44" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
      <circle cx="0" cy="0" r="24" fill="#000" fill-opacity="0" stroke="#ffffff" stroke-opacity="0.28" stroke-width="10"/>
      <path d="M0-44v16M0 28v16M-44 0h16M28 0h16" stroke="#2ecc71" stroke-opacity="0.14" stroke-width="10"/>
